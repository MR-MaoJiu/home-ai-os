name: Home AI checks
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python scripts/check_boundaries.py
      - name: Prepare isolated integration services
        run: |
          python scripts/dev_env.py
          docker compose --env-file .env.local -f deploy/compose.dev.yml up -d --wait --wait-timeout 120
          python scripts/migrate.py --test
          homeai init-key
      - name: Unit and PostgreSQL policy/sync tests
        run: HOMEAI_INTEGRATION=1 pytest -q
      - run: python -m compileall -q server providers
      - name: Stop isolated services
        if: always()
        run: docker compose --env-file .env.local -f deploy/compose.dev.yml down --volumes
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - run: xcodebuild -project ios/HomeAI.xcodeproj -scheme HomeAI -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Select simulator
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          candidates = [d for runtime, entries in devices.items() if 'iOS-' in runtime and int(runtime.split('iOS-')[1].split('-')[0]) >= 18 for d in entries if d['name'].startswith('iPhone') and d.get('isAvailable')]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('HOMEAI_SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
          PYCODE
      - run: xcodebuild -project ios/HomeAI.xcodeproj -scheme HomeAI -destination "platform=iOS Simulator,id=$HOMEAI_SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO test
